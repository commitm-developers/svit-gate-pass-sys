name: Feature / Task
description: A planned piece of work from the PRD backlog
title: "[ISSUE-ID] Short action phrase"
labels: ["feature"]
body:
  - type: input
    id: issue_id
    attributes:
      label: Issue ID
      description: From PRD Appendix A (for example GP-BE-02)
    validations:
      required: true
  - type: input
    id: prd_ref
    attributes:
      label: PRD requirement ID(s)
      placeholder: "QR-4, QR-9"
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options: [Frontend, Backend, Both, DevOps]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0 - must have for MVP", "P1 - should have"]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      description: Split anything larger than L
      options: ["S - up to 1 day", "M - 2 days", "L - 3 days"]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and where it fits in the user flow.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and what is explicitly not.
      placeholder: |
        In scope:
        -
        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API contract / UI reference
      description: Route, request, response, error codes; or a Figma / sketch link.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. Given / When / Then works well.
      value: |
        - [ ] Given ..., when ..., then ...
        - [ ] Given ..., when ..., then ...
        - [ ] Validation and role checks in place
        - [ ] Tests added
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      description: Issues that must be done first.
      placeholder: "Depends on GP-BE-01"
