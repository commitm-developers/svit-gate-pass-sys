name: Bug report
description: Something is broken or behaves wrongly
title: "[BUG] Short description"
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - someone can leave without a valid pass, data leak, or app down
        - High - a core flow is broken
        - Medium - feature partly broken, workaround exists
        - Low - cosmetic or minor
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role used
      options: [Student, Security, Admin, Not logged in]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Pass number or user ID
      description: Never paste passwords or tokens.
      placeholder: GP-2610-0001
  - type: input
    id: env
    attributes:
      label: Device and browser
      placeholder: "Android 14, Chrome 130"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recording, or console/network errors
